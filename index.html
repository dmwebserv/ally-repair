<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <script>
      // Apply the saved per-device accent before first paint.
      // Kept in sync with src/lib/theme.ts; the value lives under its own
      // localStorage key and is never part of backups.
      (function () {
        try {
          var colors = {
            green: ['#059669', '#34d399'],
            blue: ['#2563eb', '#60a5fa'],
            purple: ['#7c3aed', '#a78bfa'],
            orange: ['#ea580c', '#fb923c'],
            pink: ['#db2777', '#f472b6'],
          };
          var id = localStorage.getItem('nutrilog:theme');
          if (id && id !== 'green' && colors[id]) {
            document.documentElement.setAttribute('data-theme', id);
          }
          var pair = colors[id] || colors.green;
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? pair[1] : pair[0]);
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NutriLog" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>NutriLog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
