name: Deploy AI scan proxy (Cloudflare Worker)

on:
  push:
    branches:
      - claude/food-nutrition-logger-ujzr6a
      - main
    paths:
      - worker/**
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync Worker secrets
        run: |
          put_secret() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::error::GitHub secret for $name is empty or missing — check Settings > Secrets and variables > Actions > Repository secrets (not an Environment)."
              exit 1
            fi
            echo "$value" | npx wrangler secret put "$name"
          }
          put_secret OPENAI_API_KEY "${{ secrets.OPENAI_API_KEY }}"
          put_secret APP_SHARED_SECRET "${{ secrets.SCAN_SHARED_SECRET }}"
          put_secret GITHUB_BACKUP_TOKEN "${{ secrets.GH_BACKUP_TOKEN }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
