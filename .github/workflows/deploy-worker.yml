name: Deploy AI scan proxy (Cloudflare Worker)

on:
  push:
    branches:
      - claude/food-nutrition-logger-ujzr6a
      - main
    paths:
      - worker/**
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync Worker secrets
        run: |
          echo "${{ secrets.OPENAI_API_KEY }}" | npx wrangler secret put OPENAI_API_KEY
          echo "${{ secrets.SCAN_SHARED_SECRET }}" | npx wrangler secret put APP_SHARED_SECRET
          echo "${{ secrets.GH_BACKUP_TOKEN }}" | npx wrangler secret put GITHUB_BACKUP_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
